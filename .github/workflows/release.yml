name: Release

# On a v* tag: generate the changelog from the gitmoji history (git-cliff + cliff.toml),
# publish a GitHub release, and attach cross-OS observer binaries. The observer image is
# built/pushed by docker-publish.yml, which also triggers on v* tags.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create/update release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ github.ref_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          token: ${{ github.token }}

  binaries:
    name: Cross-OS binaries
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build archives + checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            bin="svchealthcheck"; [ "$os" = "windows" ] && bin="svchealthcheck.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -ldflags "-s -w" -o "dist/$bin" ./cmd/svchealthcheck
            name="couchbase-health-observer_${TAG}_${os}_${arch}"
            if [ "$os" = "windows" ]; then (cd dist && zip -q "${name}.zip" "$bin"); else (cd dist && tar czf "${name}.tar.gz" "$bin"); fi
            rm -f "dist/$bin"
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber

  chart:
    name: Helm chart
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.1.4

      # Chart version, appVersion and image tag move together, so a customer can
      # read one number. A mismatch here means the tag and the chart disagree.
      - name: Versions agree with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          chart_version="$(helm show chart charts/couchbase-health-observer | awk '/^version:/ {print $2}')"
          app_version="$(helm show chart charts/couchbase-health-observer | awk '/^appVersion:/ {print $2}' | tr -d '"')"
          [ "$chart_version" = "$want" ] || { echo "Chart.yaml version $chart_version != tag $want"; exit 1; }
          [ "$app_version" = "$want" ] || { echo "Chart.yaml appVersion $app_version != tag $want"; exit 1; }

      - name: Package
        run: helm package charts/couchbase-health-observer --destination dist

      # OCI is the standard path. The .tgz on the release covers pipelines that
      # cannot reach an OCI registry.
      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/*.tgz oci://ghcr.io/couchbase-ps/charts

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/*.tgz --clobber
