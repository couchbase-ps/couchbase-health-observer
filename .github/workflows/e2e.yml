name: e2e

# GitHub-safe end-to-end suite. Runs in parallel with ci.yml (unit + terraform)
# on every PR, so a PR is a full regression gate without serial wait. AWS e2e
# (test/aws/*) is intentionally excluded -- it needs real AWS / LocalStack tiers.
on:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: compose detector e2e
        run: test/compose/e2e.sh
      - name: dump state on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs cb-observer 2>&1 | tail -100 || true

  compose-tls-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: compose TLS e2e
        run: test/compose/tls_e2e.sh
      - name: dump state on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs cb-observer-tls 2>&1 | tail -100 || true

  kind-switch-lambda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      # install_only: the script creates its own named kind cluster, so we only
      # want the kind + kubectl binaries, not kind-action's default cluster.
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: switch-lambda kind e2e
        run: test/kind/switch_lambda_e2e.sh
      - name: dump cluster state on failure
        if: failure()
        run: kubectl get pods -A -o wide || true

  # Heaviest job: 6 Couchbase server pods on kind. Proven to fit a standard
  # ubuntu-latest runner (~9m on PR #23). 45m timeout bounds a hang and leaves
  # headroom; watch for occasional resource-driven flakes.
  kind-region-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: azure/setup-helm@v5
      - name: region-switch kind e2e
        run: test/kind/e2e_switch.sh
      - name: dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get couchbaseclusters -A || true

  compose-cng-lb-e2e:
    runs-on: ubuntu-latest
    # Two Couchbase clusters, two CNG containers, Envoy and a Maven build, plus
    # scenarios that each wait out a 60s health-check window. Slower than every
    # other job here: the scenario phase alone measured 31.3 minutes on a
    # developer Mac, mostly fixed sleeps plus stack_up's six Couchbase nodes,
    # a Maven build and a Go build. 60 minutes leaves headroom above that for
    # a slower CI runner; this job is otherwise unvalidated until its first
    # green PR run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: CNG load-balancer failover e2e
        run: test/compose-cng/lb_e2e.sh
      - name: upload harness CSVs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cng-lb-output
          path: /tmp/cng-lb-out
          if-no-files-found: warn
      - name: dump state on failure
        if: failure()
        run: |
          docker ps -a || true
          curl -sS http://localhost:19901/clusters || true
          docker logs cng-envoy 2>&1 | tail -100 || true
          docker logs cng-a 2>&1 | tail -50 || true
          docker logs cb-a-observer 2>&1 | tail -50 || true
