# Centralized Kubernetes Observer (active mode): watches the primary Couchbase
# cluster and, on a sustained critical outage, repoints the cb-conn ConfigMap to
# the secondary and rolls the dependent app Deployments.
#
# PROBE WIRING (do NOT change): livenessProbe -> /healthz (loop alive),
# readinessProbe -> /readyz (K8s API reachable). NEVER point either probe at
# /health/couchbase: a real Couchbase outage would then restart the observer
# exactly when it must act.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observer
  namespace: default
---
# One ClusterRole holds the verbs; a RoleBinding per target namespace grants them
# there only. An unlisted namespace stays unreachable even if a target names it.
# Verbs match the only calls pkg/actuator makes: Get and Update on both resources.
# Targeting a further namespace means adding one more RoleBinding for it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observer
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observer
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observer
subjects:
  - kind: ServiceAccount
    name: observer
    namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: observer
  namespace: default
  labels:
    app: observer
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: observer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observer
  namespace: default
  labels:
    app: observer
spec:
  replicas: 1 # single active detector; see docs/DEPLOYMENT.md "SPOF & HA" for mitigations
  selector:
    matchLabels:
      app: observer
  template:
    metadata:
      labels:
        app: observer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: observer
      containers:
        - name: observer
          image: ghcr.io/couchbase-ps/couchbase-health-observer:latest
          imagePullPolicy: Always
          args:
            - --actuators=k8s
            - --conn=couchbase://region-a-srv.region-a.svc
            - --secondary-conn=couchbase://region-b-srv.region-b.svc
            - --bucket=observer
            - --user=Administrator
            - --pass=password
            - --critical=kv
            - --interval=5s
            - --failover-delay=150s
            - --namespace=default
            - --configmap=cb-conn
            - --config-key=connstring
            - --deployments=mock-app
            # Webhook: add "webhook" to --actuators (alone, or as k8s,webhook).
            # - --actuators=k8s,webhook
            # - --webhook-url=https://gitlab.example.com/api/v4/projects/7/ref/main/trigger/pipeline
            # - --webhook-header=X-Source: observer
            # - --webhook-timeout=3s
            # - --webhook-retries=2
            # - --webhook-ca-cert=/etc/webhook-ca/ca.pem   # enterprise CA, mount it below
            # - --webhook-skip-verify                      # insecure, logs a WARN at startup
          # env:
          #   - name: WEBHOOK_USER
          #     valueFrom: { secretKeyRef: { name: observer-webhook, key: user } }
          #   - name: WEBHOOK_PASS
          #     valueFrom: { secretKeyRef: { name: observer-webhook, key: pass } }
          #   - name: WEBHOOK_HEADER      # one "Key: Value" per line
          #     valueFrom: { secretKeyRef: { name: observer-webhook, key: headers } }
          ports:
            - name: http
              containerPort: 8080
          livenessProbe: # loop alive — NEVER /health/couchbase
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe: # wired to act (K8s API reachable) — NEVER /health/couchbase
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
