# Envoy for the CNG load-balancer test.
#
# L4 TCP passthrough, not L7. CNG explicitly removes client topology awareness
# ("Clients do not receive cluster topology information"), and Java enforces a
# single host in a couchbase2:// string, so the client can never dial around
# this proxy. Passthrough also keeps Envoy out of the crypto path, which is the
# only mode that preserves end-to-end mTLS.
#
# Note Couchbase recommends an L7 gRPC-aware balancer for throughput, because
# L4 cannot rebalance streams mid-connection. That is a load-distribution
# concern, not a failover one, and this test has a single client.
#
# The health check deliberately targets a DIFFERENT ADDRESS from the traffic
# destination: traffic goes to CNG, the verdict comes from the Observer. That
# separation is the whole point of the design, and it is the capability most
# load balancers lack.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
  - name: cng_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 18098 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: cng_tcp
          cluster: cng_cluster
          # grpc-java configures no client keepalive by default, so an idle
          # client would be reset by a short idle timeout and the reset would
          # look exactly like the failover we are measuring. One hour.
          idle_timeout: 3600s

  clusters:
  - name: cng_cluster
    connect_timeout: 2s
    type: STATIC
    lb_policy: ROUND_ROBIN
    # MANDATORY. Default is false, which only stops NEW connections to a dead
    # host and leaves the SDK's established gRPC channel alive on it, so no
    # failover happens at all. Documented as supported for tcp_proxy only.
    close_connections_on_host_health_failure: true
    common_lb_config:
      # healthy_panic_threshold defaults to 50 percent, and in panic mode Envoy
      # disregards health status and routes to hosts it knows are unhealthy. On a
      # dual outage that means new connections get proxied into a dead cluster
      # instead of refused outright. fail_traffic_on_panic makes Envoy refuse
      # those connections instead, which is both cleaner for the app and
      # legible in the CSV: it stops garbage being proxied into a dead
      # backend. Scenario 5 confirms the resulting operations still fail
      # cleanly with zero hangs, but does NOT show this makes client-visible
      # errors arrive faster than the SDK's own operation timeout: every
      # measured KV op there still took the full ~2s KV timeout to surface as
      # an error.
      healthy_panic_threshold: { value: 50 }
      zone_aware_lb_config:
        fail_traffic_on_panic: true
    health_checks:
    # 5s x 12 = a 60s sustained-down window. It must exceed the cluster
    # auto-failover timeout of 30s, or a single absorbed node loss would trip
    # the switch. Jitter is left at zero so the window stays exact.
    # timeout is 4s, above the brief's original 2s. The whole point of this
    # design is that the load balancer reads the Observer's verdict, not the
    # Observer's latency. The Observer re-probes the cluster on every request
    # and its own probe bound is 2s, so a 2s Envoy timeout can expire before
    # the Observer ever gets to answer with its 503, and Envoy then records a
    # network failure instead of reading the status code at all. That leaves
    # retriable_statuses unable to do anything, and it also means a merely
    # slow but still healthy Observer would read as unhealthy and cause a
    # false failover, which is worse than the flapping the debounce below
    # exists to prevent. 4s clears the Observer's 2s bound while staying under
    # the 5s interval, so checks still fire back to back with no overlap.
    - timeout: 4s
      interval: 5s
      unhealthy_threshold: 12
      healthy_threshold: 2
      # no_traffic_interval defaults to 60s and "takes precedence over any
      # other", so without this the first check after startup is a minute away.
      no_traffic_interval: 5s
      http_health_check:
        path: /health/couchbase
        # MANDATORY. For an HTTP health check, a status outside
        # expected_statuses bypasses unhealthy_threshold entirely and marks the
        # host unhealthy IMMEDIATELY. The Observer answers 503 on DOWN, so
        # without 503 listed here the 60s window above is a no-op and scenario 2
        # switches on the first check. Int64Range is half open, so 503..504
        # covers 503 alone.
        retriable_statuses:
        - start: 503
          end: 504
    load_assignment:
      cluster_name: cng_cluster
      endpoints:
      # Priority 0 is region-a. Envoy keeps all traffic here while it is
      # healthy and shifts to priority 1 only as this level degrades.
      - priority: 0
        lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 172.28.1.10, port_value: 18098 }
            # Traffic goes to CNG above; the verdict comes from the Observer
            # here. health_check_config.address redirects the check to a
            # different host entirely, and it requires a literal IP: this path
            # performs no DNS resolution.
            health_check_config:
              address:
                socket_address: { address: 172.28.1.11, port_value: 8080 }
      - priority: 1
        lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 172.28.2.10, port_value: 18098 }
            health_check_config:
              address:
                socket_address: { address: 172.28.2.11, port_value: 8080 }
