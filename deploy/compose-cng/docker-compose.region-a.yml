# region-a: 3 data + 2 index/query, bucket replica 1. Killing one data node is
# absorbed by auto-failover; killing a second is refused, which is the pair
# scenarios 2 and 3 depend on.
#
# hostname/aliases carry both the short form (env contract, observer conn
# string, Step 10 docker exec targets) and a ".local" FQDN form (only
# couchbase-cli node-init/server-add need it: Couchbase 8.0.1 refuses a
# dot-less --node-init-hostname, and a joining node's self-signed cert SAN is
# generated from this hostname field, so it must match what init-cluster.sh
# requests). Both aliases resolve on cng-lb-net; CB_PRIMARY/CB_DATA_NODES/
# CB_QUERY_NODES in env/region-a.env stay the short form, unchanged.
services:
  cb-a-data-1:
    image: couchbase:enterprise-8.0.3@sha256:db0e1cdcaf4bf4a86f7ba65857c4693ac3b5600900ec59e796fac8e75ee5293d
    container_name: cb-a-data-1
    hostname: cb-a-data-1.local
    networks:
      cng-lb-net:
        ipv4_address: 172.28.1.21
        aliases: ["cb-a-data-1", "cb-a-data-1.local"]
    ports: ["127.0.0.1:8191:8091"]
    volumes: ["cb-a-data-1:/opt/couchbase/var"]

  cb-a-data-2:
    image: couchbase:enterprise-8.0.3@sha256:db0e1cdcaf4bf4a86f7ba65857c4693ac3b5600900ec59e796fac8e75ee5293d
    container_name: cb-a-data-2
    hostname: cb-a-data-2.local
    networks:
      cng-lb-net:
        ipv4_address: 172.28.1.22
        aliases: ["cb-a-data-2", "cb-a-data-2.local"]
    volumes: ["cb-a-data-2:/opt/couchbase/var"]

  cb-a-data-3:
    image: couchbase:enterprise-8.0.3@sha256:db0e1cdcaf4bf4a86f7ba65857c4693ac3b5600900ec59e796fac8e75ee5293d
    container_name: cb-a-data-3
    hostname: cb-a-data-3.local
    networks:
      cng-lb-net:
        ipv4_address: 172.28.1.23
        aliases: ["cb-a-data-3", "cb-a-data-3.local"]
    volumes: ["cb-a-data-3:/opt/couchbase/var"]

  cb-a-iq-1:
    image: couchbase:enterprise-8.0.3@sha256:db0e1cdcaf4bf4a86f7ba65857c4693ac3b5600900ec59e796fac8e75ee5293d
    container_name: cb-a-iq-1
    hostname: cb-a-iq-1.local
    networks:
      cng-lb-net:
        ipv4_address: 172.28.1.24
        aliases: ["cb-a-iq-1", "cb-a-iq-1.local"]
    volumes: ["cb-a-iq-1:/opt/couchbase/var"]

  cb-a-iq-2:
    image: couchbase:enterprise-8.0.3@sha256:db0e1cdcaf4bf4a86f7ba65857c4693ac3b5600900ec59e796fac8e75ee5293d
    container_name: cb-a-iq-2
    hostname: cb-a-iq-2.local
    networks:
      cng-lb-net:
        ipv4_address: 172.28.1.25
        aliases: ["cb-a-iq-2", "cb-a-iq-2.local"]
    volumes: ["cb-a-iq-2:/opt/couchbase/var"]

  init:
    depends_on:
      - cb-a-data-1
      - cb-a-data-2
      - cb-a-data-3
      - cb-a-iq-1
      - cb-a-iq-2

volumes:
  cb-a-data-1:
  cb-a-data-2:
  cb-a-data-3:
  cb-a-iq-1:
  cb-a-iq-2:
